[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zd-mast"
version = "1.0.0rc2"
description = "Reproducibility utilities for the ZD-MAST two-site MALDI-AST benchmark"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pyarrow>=23",
]

[project.optional-dependencies]
modeling = ["lightgbm==4.6.0"]
submission = ["matplotlib>=3.10", "python-docx>=1.2"]
test = ["pytest>=8.0"]

[project.scripts]
zd-mast = "zd_mast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
